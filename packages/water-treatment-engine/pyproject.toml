[project]
name = "water-treatment-engine"
version = "0.2.0"
description = "Reusable water-treatment engineering engine for brewing, mead, and distilling."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    { name = "Greg Roe" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ferm-units>=0.1.2,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/GregRR/water-treatment-calculator"
Repository = "https://github.com/GregRR/water-treatment-calculator"
Issues = "https://github.com/GregRR/water-treatment-calculator/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"
