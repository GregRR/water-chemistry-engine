name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-suffix: "python-${{ matrix.python-version }}"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }} --locked

      - name: Compile Python sources
        run: uv run --python ${{ matrix.python-version }} python -m compileall -q src

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  quality:
    name: Quality checks and distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-suffix: "quality-python-3.14"

      - name: Install Python
        run: uv python install 3.14

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev --python 3.14 --locked

      - name: Check formatting
        run: uv run --python 3.14 ruff format --check .

      - name: Run lint checks
        run: uv run --python 3.14 ruff check .

      - name: Run type checks
        run: >-
          uv run --python 3.14 mypy --strict
          src

      - name: Build distribution
        run: uv build --python 3.14
