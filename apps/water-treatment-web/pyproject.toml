[project]
name = "water-treatment-web"
version = "0.1.0"
description = "Standalone web interface for the water-treatment engine."
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
authors = [
    { name = "Greg Roe" },
]
dependencies = [
    "water-treatment-engine",
]

[tool.uv.sources]
water-treatment-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"
