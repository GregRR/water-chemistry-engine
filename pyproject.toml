[project]
name = "water-chemistry-engine"
version = "0.2.0"
description = "Reusable water-chemistry engine for brewing, fermentation, and other validated uses."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Greg Roe" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ferm-units>=0.1.3,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/GregRR/water-chemistry-engine"
Repository = "https://github.com/GregRR/water-chemistry-engine"
Issues = "https://github.com/GregRR/water-chemistry-engine/issues"

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
# Preserve Ruff 0.16.1's broad default lint policy without copying hundreds of
# rule codes into this file; a rule-set change therefore requires a deliberate
# Ruff version/configuration update.
required-version = "==0.16.1"
target-version = "py311"
